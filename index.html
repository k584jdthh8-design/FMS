<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meena FMS</title>
<style>
:root{--v:#512DA8;--p:#9C27B0;--bg:#F6F5FA;--card:#fff;--tx:#22232A;--mut:#777484;--ln:#E7E5EE;--ok:#14825C;--danger:#C7434B}
body.dark{--bg:#111117;--card:#1B1A22;--tx:#F6F3FA;--mut:#AAA6B3;--ln:#302E39}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{height:64px;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.brand{font-weight:900}.actions{display:flex;gap:8px}.ib{width:40px;height:40px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx)}
.wrap{max-width:1200px;margin:auto;padding:18px 16px 90px}.hero{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:16px}h1{margin:0;font-size:25px}.mut{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:14px}.tab{border:1px solid var(--ln);background:var(--card);padding:10px 14px;border-radius:12px;color:var(--tx);white-space:nowrap}.tab.active{background:linear-gradient(90deg,var(--v),var(--p));color:#fff;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.k{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:15px}.k b{font-size:27px;display:block}.k span{font-size:11px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}.ph{padding:15px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}.ph b{font-size:15px}
.city{padding:11px 15px;display:grid;grid-template-columns:90px 1fr 28px;gap:10px;align-items:center}.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--v),var(--p))}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.q{border:1px solid var(--ln);background:var(--card);border-radius:13px;padding:14px;text-align:right;color:var(--tx)}.q b{display:block;font-size:12px}.q span{font-size:10px;color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.inp{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:11px;padding:10px 11px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fcard{background:var(--card);border:1px solid var(--ln);border-radius:15px;padding:14px}.fcard .code{font-weight:900;font-size:16px}.fcard small{display:block;color:var(--mut);margin-top:3px}.badge{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:999px;background:#EAF6F1;color:var(--ok);font-size:10px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px 13px;border-bottom:1px solid var(--ln);font-size:12px;text-align:right;white-space:nowrap}th{color:var(--mut)}
.primary{border:0;background:linear-gradient(90deg,var(--v),var(--p));color:white;border-radius:11px;padding:10px 14px;font-weight:800}.secondary{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:11px;padding:10px 14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(650px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px}.sheet h2{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--mut)}.field.full{grid-column:1/-1}textarea.inp{min-height:100px;resize:vertical}.row{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}.msg{font-size:12px;margin-top:10px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:24px}.loginbox h2{margin-top:0}
.bottom{display:none}
@media(max-width:850px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}}
@media(max-width:600px){.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.bottom{display:flex;position:fixed;bottom:12px;left:12px;right:12px;background:var(--card);border:1px solid var(--ln);border-radius:17px;padding:7px;justify-content:space-around;z-index:30}.bottom button{border:0;background:transparent;color:var(--mut);padding:8px}}

.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detailbox{border:1px solid var(--ln);border-radius:13px;padding:12px;background:var(--card)}.detailbox span{display:block;font-size:10px;color:var(--mut);margin-bottom:4px}.detailbox b{font-size:13px}.detailfull{grid-column:1/-1}.timeline{margin-top:14px;border-top:1px solid var(--ln);padding-top:12px}.tevent{padding:10px 0;border-bottom:1px solid var(--ln)}.tevent b{display:block;font-size:12px}.tevent span{font-size:10px;color:var(--mut)}.linkbtn{border:0;background:transparent;color:var(--v);font-weight:800;padding:0}.wochip{display:inline-block;margin:4px 4px 0 0;padding:6px 9px;border-radius:999px;background:rgba(81,45,168,.09);color:var(--v);font-size:10px}.clickrow{cursor:pointer}.clickrow:hover{background:rgba(81,45,168,.04)}
@media(max-width:600px){.detailgrid{grid-template-columns:1fr}.detailfull{grid-column:auto}}
</style>
</head>
<body><div id="app"></div>
<div class="modal" id="ticketModal"><div class="sheet"><h2>بلاغ جديد</h2><div class="formgrid">
<div class="field"><label>المنشأة</label><select class="inp" id="tfac"></select></div>
<div class="field"><label>القسم</label><select class="inp" id="tdep"></select></div>
<div class="field"><label>الموقع / الغرفة</label><input class="inp" id="troom" placeholder="مثال: الدور الثاني - العلاج الطبيعي"></div>
<div class="field"><label>الأولوية</label><select class="inp" id="tpri"><option value="medium">متوسط</option><option value="low">منخفض</option><option value="high">عالي</option><option value="critical">حرج</option><option value="extreme">حرج جدًا</option></select></div>
<div class="field full"><label>عنوان البلاغ</label><input class="inp" id="tsub" placeholder="وصف مختصر للمشكلة"></div>
<div class="field full"><label>التفاصيل</label><textarea class="inp" id="tdesc" placeholder="اكتب تفاصيل المشكلة"></textarea></div>
</div><div class="row"><button class="primary" id="saveTicket">إرسال البلاغ</button><button class="secondary" id="closeTicket">إلغاء</button></div><div class="msg" id="tmsg"></div></div></div>

<div class="modal" id="detailModal"><div class="sheet">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 id="dtitle">تفاصيل البلاغ</h2><button class="secondary" id="closeDetail">إغلاق</button></div>
<div id="detailBody"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient("https://xlijscxrapuddtmbnxhe.supabase.co","sb_publishable_jbElXTf55gOag4vIB0ahUw_NBL1UNmF");const app=document.getElementById('app');
let facilities=[],departments=[],ctx=null,tickets=[],workorders=[],assetsData={assets:[],summary:{}};
const arType=x=>({Clinic:'عيادة',Office:'مكتب',Accommodation:'سكن'})[x]||x||'-';
const arStatus=x=>({active:'نشط',preparing:'تحت التجهيز',temporarily_closed:'مغلق مؤقتًا',inactive:'غير نشط'})[x]||x||'نشط';
const arTicket=x=>({new:'جديد',under_review:'تحت المراجعة',converted_to_work_order:'تم التحويل لأمر عمل',in_progress:'قيد التنفيذ',waiting_reporter_info:'بانتظار معلومات',waiting_approval:'بانتظار اعتماد',completed:'مكتمل',closed:'مغلق',rejected:'مرفوض',cancelled:'ملغي'})[x]||x||'-';
const arWO=x=>({new:'جديد',assigned:'مسند',in_progress:'قيد التنفيذ',paused:'متوقف مؤقتًا',waiting_part:'بانتظار قطعة',waiting_vendor:'بانتظار مورد',waiting_approval:'بانتظار اعتماد',completed:'مكتمل',rework:'إعادة عمل',closed:'مغلق',cancelled:'ملغي'})[x]||x||'-';
async function boot(){const s=await sb.auth.getSession();s.data.session?load():login()}
function login(msg=''){app.innerHTML=`<div class="login"><form class="loginbox" id="lf"><h2>Meena FMS</h2><p class="mut">تسجيل الدخول بحساب العمل</p><div class="field"><label>البريد الإلكتروني</label><input class="inp" id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input class="inp" id="pass" type="password" required></div><button class="primary" style="width:100%;margin-top:10px">دخول</button>${msg?`<div class="msg" style="color:var(--danger)">${msg}</div>`:''}</form></div>`;lf.onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});r.error?login('تعذر تسجيل الدخول'):load()}}
async function openAssetFromToken(){
  const token=new URLSearchParams(location.search).get('asset');
  if(!token)return false;
  const r=await sb.from('assets').select('id').eq('qr_token',token).maybeSingle();
  if(r.data?.id){openAssetDetail(r.data.id);return true}
  return false;
}
async function load(){app.innerHTML='<div class="login"><div class="loginbox">جاري تحميل النظام...</div></div>';const [c,f,d,t,w,a]=await Promise.all([sb.from('my_account_context').select('*').maybeSingle(),sb.from('facilities').select('*').order('code'),sb.from('departments').select('*').eq('is_active',true).order('name_ar'),sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100),sb.from('work_orders').select('*').order('created_at',{ascending:false}).limit(100),sb.rpc('get_assets_overview')]);ctx=c.data;facilities=f.data||[];departments=d.data||[];tickets=t.data||[];workorders=w.data||[];assetsData=a.data||{assets:[],summary:{}};render('dashboard');setTimeout(()=>openAssetFromToken(),100)}
function shell(content,active){return `<div class="top"><div class="brand">MEENA FMS</div><div class="actions"><button class="ib" id="theme">◐</button><button class="ib" id="logout">↪</button></div></div><div class="wrap"><div class="tabs">${tab('لوحة التحكم','dashboard',active)}${tab('المنشآت','facilities',active)}${tab('البلاغات','tickets',active)}${tab('أوامر العمل','workorders',active)}${tab('الأصول والصيانة','assets',active)}</div>${content}</div><div class="bottom"><button data-go="dashboard">الرئيسية</button><button data-go="facilities">المنشآت</button><button data-go="tickets">البلاغات</button></div>`}
function tab(l,v,a){return `<button class="tab ${a===v?'active':''}" data-go="${v}">${l}</button>`}
function bindNav(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));theme.onclick=()=>document.body.classList.toggle('dark');logout.onclick=async()=>{await sb.auth.signOut();login()}}
function render(page){if(page==='dashboard')dashboard();if(page==='facilities')facPage();if(page==='tickets')ticketPage();if(page==='workorders')woPage();if(page==='assets')assetPage();bindNav()}
function dashboard(){const cm={};facilities.forEach(x=>cm[x.city]=(cm[x.city]||0)+1);const max=Math.max(...Object.values(cm),1);const html=`<div class="hero"><div><h1>لوحة التحكم</h1><div class="mut">${ctx?.role_name_ar||'مدير النظام'} • ${ctx?.full_name||ctx?.work_email||''}</div></div><button class="primary" id="newTicket">+ بلاغ جديد</button></div><div class="kpis">${k('المنشآت',facilities.length)}${k('البلاغات',tickets.length)}${k('أوامر العمل',workorders.length)}${k('العيادات',facilities.filter(x=>x.facility_type==='Clinic').length)}${k('المدن',new Set(facilities.map(x=>x.city)).size)}</div><div class="grid"><div class="panel"><div class="ph"><b>التوزيع حسب المدينة</b></div>${Object.entries(cm).sort((a,b)=>b[1]-a[1]).map(([city,n])=>`<div class="city"><b>${city}</b><div class="bar"><div class="fill" style="width:${n/max*100}%"></div></div><span>${n}</span></div>`).join('')}</div><div class="panel"><div class="ph"><b>الوصول السريع</b></div><div class="quick"><button class="q" id="qTicket"><b>بلاغ جديد</b><span>إنشاء ومتابعة بلاغ</span></button><button class="q" data-go="workorders"><b>أوامر العمل</b><span>متابعة التنفيذ</span></button><button class="q" data-go="facilities"><b>المنشآت</b><span>استعراض الفروع</span></button><button class="q" data-go="tickets"><b>البلاغات</b><span>الحالات الحالية</span></button><button class="q" data-go="assets"><b>الأصول والصيانة</b><span>PM وحالة الأصول</span></button></div></div></div>`;app.innerHTML=shell(html,'dashboard');document.getElementById('newTicket').onclick=openTicket;document.getElementById('qTicket').onclick=openTicket}
function k(l,v){return `<div class="k"><b>${v}</b><span>${l}</span></div>`}
function facPage(){const html=`<div class="hero"><div><h1>المنشآت</h1><div class="mut">${facilities.length} منشأة مسجلة</div></div></div><div class="filters"><input class="inp" id="fsearch" placeholder="بحث عن فرع أو مدينة أو حي"><select class="inp" id="fcity"><option value="">جميع المدن</option>${[...new Set(facilities.map(x=>x.city))].sort().map(x=>`<option>${x}</option>`).join('')}</select></div><div class="cards" id="fcards">${facilities.map(fcard).join('')}</div>`;app.innerHTML=shell(html,'facilities');const filt=()=>{const q=fsearch.value.toLowerCase(),c=fcity.value;fcards.innerHTML=facilities.filter(x=>(!q||[x.code,x.name_ar,x.name_en,x.city,x.district].join(' ').toLowerCase().includes(q))&&(!c||x.city===c)).map(fcard).join('')};fsearch.oninput=filt;fcity.onchange=filt}
function fcard(x){return `<div class="fcard"><div class="code">${x.code}</div><small>${x.name_ar||x.name_en||x.code}</small><small>${x.district||'-'} • ${x.city||'-'}</small><small>${arType(x.facility_type)}</small><span class="badge">${arStatus(x.status)}</span></div>`}
function ticketPage(){const rows=tickets.map(x=>`<tr class="clickrow" data-ticket="${x.id}"><td><button class="linkbtn">${x.ticket_number}</button></td><td>${x.subject}</td><td>${arTicket(x.status)}</td><td>${x.priority}</td><td>${new Date(x.created_at).toLocaleDateString('ar-SA')}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">لا توجد بلاغات حتى الآن</td></tr>';const html=`<div class="hero"><div><h1>البلاغات</h1><div class="mut">متابعة البلاغات حسب صلاحيات حسابك</div></div><button class="primary" id="newTicket">+ بلاغ جديد</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>الرقم</th><th>العنوان</th><th>الحالة</th><th>الأولوية</th><th>التاريخ</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;app.innerHTML=shell(html,'tickets');document.getElementById('newTicket').onclick=openTicket;document.querySelectorAll('[data-ticket]').forEach(r=>r.onclick=()=>openTicketDetail(r.dataset.ticket))}
function woPage(){const rows=workorders.map(x=>`<tr class="clickrow" data-wo="${x.id}"><td><button class="linkbtn">${x.work_order_number}</button></td><td>${esc(x.title)}</td><td>${arWO(x.status)}</td><td>${fmtPriority(x.priority)}</td><td>${new Date(x.created_at).toLocaleDateString('ar-SA')}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">لا توجد أوامر عمل حتى الآن</td></tr>';const html=`<div class="hero"><div><h1>أوامر العمل</h1><div class="mut">المتابعة التشغيلية لأوامر العمل</div></div></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>الرقم</th><th>العنوان</th><th>الحالة</th><th>الأولوية</th><th>التاريخ</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;app.innerHTML=shell(html,'workorders');document.querySelectorAll('[data-wo]').forEach(r=>r.onclick=()=>openWorkOrderDetail(r.dataset.wo))}
function arAssetStatus(x){return ({in_service:'في الخدمة',out_of_service:'خارج الخدمة',under_maintenance:'تحت الصيانة',retired:'مستبعد',pending_replacement:'بانتظار الاستبدال',not_ready:'غير جاهز',ready:'جاهز'})[x]||x||'-'}
function pmStatus(x){return ({scheduled:'مجدول',due:'مستحق',overdue:'متأخر',generated:'تم إنشاء أمر عمل',completed:'مكتمل',cancelled:'ملغي'})[x]||x||'-'}
function assetPage(){const s=assetsData.summary||{},rows=(assetsData.assets||[]).map(a=>`<tr class="clickrow" data-asset="${a.id}"><td><button class="linkbtn">${esc(a.asset_code)}</button></td><td>${esc(a.name)}</td><td>${esc(a.facility_code||'-')}</td><td>${arAssetStatus(a.status)}</td><td>${Number(a.health_score||0).toFixed(0)}%</td><td>${a.next_pm_date?new Date(a.next_pm_date).toLocaleDateString('ar-SA'):'-'}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">لا توجد أصول مسجلة</td></tr>';const html=`<div class="hero"><div><h1>الأصول والصيانة الوقائية</h1><div class="mut">متابعة الأصول وخطط PM والاستحقاقات</div></div></div><div class="kpis">${k('إجمالي الأصول',s.total||0)}${k('خارج الخدمة',s.out_of_service||0)}${k('PM مستحق/متأخر',s.due_pm||0)}${k('متوسط الصحة',(s.avg_health||0)+'%')}</div><div class="panel"><div class="tablewrap"><table><thead><tr><th>الكود</th><th>الأصل</th><th>المنشأة</th><th>الحالة</th><th>الصحة</th><th>PM القادم</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;app.innerHTML=shell(html,'assets');document.querySelectorAll('[data-asset]').forEach(r=>r.onclick=()=>openAssetDetail(r.dataset.asset))}
async function showAssetQR(id){
  const r=await sb.rpc('get_asset_qr_label',{p_asset_id:id,p_mark_printed:false});
  if(r.error)return alert('تعذر إنشاء QR: '+r.error.message);
  const q=r.data,p=q.payload||{};
  dtitle.textContent='ملصق QR للأصل';
  detailBody.innerHTML=`<div id="qrPrintArea" style="text-align:center;border:2px solid var(--v);border-radius:18px;padding:20px;max-width:420px;margin:auto;background:white;color:#222"><div style="font-weight:900;font-size:18px">MEENA FMS</div><div style="margin-top:10px;font-size:20px;font-weight:900">${esc(p.asset_code||'')}</div><div style="font-size:16px;margin-top:4px">${esc(p.asset_name_ar||'')}</div><canvas id="qrCanvas" style="margin:16px auto"></canvas><div style="font-size:13px">${esc(p.facility_code||'')} • ${esc(p.facility_name||'')}</div><div style="font-size:9px;word-break:break-all;margin-top:8px">${esc(q.qr_token)}</div></div><div class="row"><button class="primary" id="printQrBtn">طباعة الملصق</button><button class="secondary" id="backAssetBtn">رجوع للأصل</button></div>`;
  const scanUrl=location.origin+location.pathname+'?asset='+encodeURIComponent(q.qr_token);
  if(window.QRCode){QRCode.toCanvas(document.getElementById('qrCanvas'),scanUrl,{width:180,margin:1},()=>{});}else{document.getElementById('qrCanvas').outerHTML='<div class="mut">'+esc(scanUrl)+'</div>'}
  document.getElementById('backAssetBtn').onclick=()=>openAssetDetail(id);
  document.getElementById('printQrBtn').onclick=async()=>{await sb.rpc('get_asset_qr_label',{p_asset_id:id,p_mark_printed:true});const area=document.getElementById('qrPrintArea').outerHTML;const w=window.open('','_blank');w.document.write(`<html><head><title>QR</title></head><body style="font-family:Arial;display:flex;justify-content:center;padding:20px">${area}<script>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()};
}
async function refreshAssets(){const r=await sb.rpc('get_assets_overview');assetsData=r.data||assetsData}
async function openAssetDetail(id){
  dtitle.textContent='تفاصيل الأصل';detailBody.innerHTML='<div class="mut">جاري تحميل الأصل...</div>';detailModal.classList.add('show');
  const r=await sb.rpc('get_asset_detail',{p_asset_id:id});if(r.error||!r.data){detailBody.innerHTML=`<div class="msg" style="color:var(--danger)">تعذر تحميل الأصل: ${esc(r.error?.message||'')}</div>`;return}
  const x=r.data,a=x.asset,f=x.facility||{},ty=x.type||{},plans=x.plans||[],sch=x.schedules||[],read=x.readings||[];
  dtitle.textContent=a.asset_code;
  detailBody.innerHTML=`<div class="detailgrid">
    <div class="detailbox"><span>اسم الأصل</span><b>${esc(a.asset_name_ar)}</b></div>
    <div class="detailbox"><span>النوع</span><b>${esc(ty.name_ar||'-')}</b></div>
    <div class="detailbox"><span>المنشأة</span><b>${esc(f.code||'-')} - ${esc(f.city||'')}</b></div>
    <div class="detailbox"><span>الحالة</span><b>${arAssetStatus(a.status)}</b></div>
    <div class="detailbox"><span>درجة الصحة</span><b>${Number(a.health_score||0).toFixed(0)}%</b></div>

      ${x.health?.repeat_root_count>=3?`<div class="detailbox detailfull"><span>تنبيه عطل متكرر</span><b>${esc(x.health.repeat_root_cause||'')} تكرر ${x.health.repeat_root_count} مرات خلال 180 يوم</b></div>`:''}

      <div class="detailbox"><span>وقت التوقف بالدقائق</span><input class="inp" id="failDown" type="number" min="0" value="0"></div>
      <div class="detailbox"><span>تكلفة الإصلاح</span><input class="inp" id="failCost" type="number" min="0" step="0.01" value="0"></div>
      <div class="detailbox detailfull"><span>ملاحظات</span><input class="inp" id="failNote"></div>
    </div>
    <div class="row"><button class="secondary" id="recordFailureBtn">تسجيل العطل</button></div>

  </div>

  ${(x.replacement_reviews||[]).length?`<div class="panel" style="margin-top:14px;padding:14px"><b>مراجعة الاستبدال</b>${x.replacement_reviews.map(rr=>`<div class="detailbox" style="margin-top:8px"><b>${esc(rr.reason_summary)}</b><div class="mut">التوصية: ${esc(rr.recommendation)} • الأعطال: ${rr.failure_count||0} • تكلفة الصيانة: ${Number(rr.maintenance_cost||0).toFixed(2)} ر.س</div>${!rr.decision?`<div class="detailgrid" style="margin-top:8px"><div class="detailbox"><span>تكلفة الاستبدال المقترحة</span><input class="inp" id="repCost_${rr.id}" type="number" min="0" step="0.01"></div><div class="detailbox"><span>سبب القرار</span><input class="inp" id="repReason_${rr.id}"></div></div><div class="row"><button class="primary" data-rep="${rr.id}" data-decision="approve_replacement">اعتماد الاستبدال</button><button class="secondary" data-rep="${rr.id}" data-decision="continue_service">استمرار الخدمة</button><button class="secondary" data-rep="${rr.id}" data-decision="defer">تأجيل</button></div>`:`<div class="mut">القرار: ${esc(rr.decision)}${rr.decision_reason?' • '+esc(rr.decision_reason):''}</div>`}</div>`).join('')}</div>`:''}

  <div class="panel" style="margin-top:14px;padding:14px"><b>خطط الصيانة الوقائية PM</b>
    <div style="margin-top:8px">${plans.length?plans.map(p=>`<div class="detailbox" style="margin-bottom:8px"><b>${esc(p.plan_name_ar)}</b><div class="mut">كل ${p.frequency_value} ${p.frequency_type} • تنبيه قبل ${p.lead_time_days} يوم</div><div class="row"><input class="inp" type="date" id="pmdate_${p.id}"><button class="secondary" data-schedule-pm="${p.id}">جدولة</button></div></div>`).join(''):'<div class="mut">لا توجد خطة PM لهذا الأصل</div>'}</div>
    <div class="detailgrid" style="margin-top:10px">
      <div class="detailbox"><span>اسم الخطة</span><input class="inp" id="pmName" placeholder="مثال: الصيانة الشهرية للمولد"></div>
      <div class="detailbox"><span>التكرار</span><select class="inp" id="pmFreq"><option value="week">أسبوع</option><option value="month" selected>شهر</option><option value="day">يوم</option><option value="year">سنة</option></select></div>
      <div class="detailbox"><span>كل</span><input class="inp" id="pmVal" type="number" min="1" value="1"></div>
      <div class="detailbox"><span>التنبيه قبل - أيام</span><input class="inp" id="pmLead" type="number" min="0" value="7"></div>
      <div class="detailbox"><span>المدة المتوقعة بالدقائق</span><input class="inp" id="pmDur" type="number" min="0"></div>
      <div class="detailbox"><span>Checklist</span><select class="inp" id="pmChecklist"><option value="true">مطلوب</option><option value="false">غير مطلوب</option></select></div>
    </div><div class="row"><button class="secondary" id="createPmBtn">إنشاء خطة PM</button></div>
  </div>

  <div class="panel" style="margin-top:14px;padding:14px"><b>جدول الصيانة</b>
    <div style="margin-top:8px">${sch.length?sch.map(s=>`<div class="detailbox" style="margin-bottom:8px"><b>${new Date(s.scheduled_date).toLocaleDateString('ar-SA')}</b><div class="mut">${pmStatus(s.status)}${s.work_order_number?' • '+esc(s.work_order_number):''}</div>${!s.work_order_id?`<div class="row"><button class="primary" data-gen-pm="${s.id}">إنشاء أمر عمل</button></div>`:''}</div>`).join(''):'<div class="mut">لا توجد مواعيد PM مجدولة</div>'}</div>
  </div>

  <div class="panel" style="margin-top:14px;padding:14px"><b>قراءات الحالة</b>
    <div style="margin-top:8px">${read.length?read.slice(0,8).map(v=>`<div class="tevent"><b>${esc(v.metric_code)}: ${v.reading_value} ${esc(v.unit||'')}</b><span>${new Date(v.recorded_at).toLocaleString('ar-SA')} • ${esc(v.status)}</span></div>`).join(''):'<div class="mut">لا توجد قراءات</div>'}</div>

  </div>`;

  const outBtn=document.getElementById('assetOutBtn');
  if(outBtn) outBtn.onclick=async()=>{const reason=prompt('سبب إخراج الأصل من الخدمة');if(!reason)return;const rr=await sb.rpc('set_asset_status',{p_asset_id:id,p_status:'out_of_service',p_reason:reason});if(rr.error)return alert('تعذر تغيير الحالة: '+rr.error.message);await refreshAssets();openAssetDetail(id)};
  const inBtn=document.getElementById('assetInBtn');
  if(inBtn) inBtn.onclick=async()=>{const rr=await sb.rpc('set_asset_status',{p_asset_id:id,p_status:'in_service',p_reason:'إعادة الأصل للخدمة'});if(rr.error)return alert('تعذر إعادة الأصل للخدمة: '+rr.error.message);await refreshAssets();openAssetDetail(id)};
  const failBtn=document.getElementById('recordFailureBtn');
  if(failBtn) failBtn.onclick=async()=>{const rr=await sb.rpc('record_asset_failure',{p_asset_id:id,p_failure_type:failType.value||null,p_root_cause:failRoot.value||null,p_downtime_minutes:Number(failDown.value||0),p_repair_cost:Number(failCost.value||0),p_notes:failNote.value||null,p_work_order_id:null});if(rr.error)return alert('تعذر تسجيل العطل: '+rr.error.message);await refreshAssets();openAssetDetail(id)};
  const qrBtn=document.getElementById('qrBtn');
  if(qrBtn) qrBtn.onclick=()=>showAssetQR(id);
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=async()=>{const rid=b.dataset.rep,decision=b.dataset.decision,reason=document.getElementById('repReason_'+rid)?.value||null,cost=document.getElementById('repCost_'+rid)?.value;const rr=await sb.rpc('review_asset_replacement',{p_review_id:rid,p_decision:decision,p_reason:reason,p_proposed_replacement_cost:cost?Number(cost):null});if(rr.error)return alert('تعذر حفظ القرار: '+rr.error.message);await refreshAssets();openAssetDetail(id)});
  document.getElementById('createPmBtn').onclick=async()=>{const name=pmName.value.trim();if(!name)return alert('اسم الخطة مطلوب');const rr=await sb.rpc('create_pm_plan',{p_asset_id:id,p_plan_name_ar:name,p_frequency_type:pmFreq.value,p_frequency_value:Number(pmVal.value||1),p_lead_time_days:Number(pmLead.value||7),p_estimated_duration_minutes:pmDur.value?Number(pmDur.value):null,p_checklist_required:pmChecklist.value==='true'});if(rr.error)return alert('تعذر إنشاء الخطة: '+rr.error.message);await refreshAssets();openAssetDetail(id)};
  document.querySelectorAll('[data-schedule-pm]').forEach(b=>b.onclick=async()=>{const pid=b.dataset.schedulePm,date=document.getElementById('pmdate_'+pid)?.value;if(!date)return alert('اختر تاريخ الصيانة');const rr=await sb.rpc('schedule_pm',{p_pm_plan_id:pid,p_scheduled_date:date});if(rr.error)return alert('تعذر الجدولة: '+rr.error.message);await refreshAssets();openAssetDetail(id)});
  document.querySelectorAll('[data-gen-pm]').forEach(b=>b.onclick=async()=>{const rr=await sb.rpc('generate_pm_work_order',{p_pm_schedule_id:b.dataset.genPm});if(rr.error)return alert('تعذر إنشاء أمر العمل: '+rr.error.message);const wr=await sb.from('work_orders').select('*').order('created_at',{ascending:false}).limit(100);workorders=wr.data||workorders;await refreshAssets();alert('تم إنشاء أمر العمل '+(rr.data?.work_order_number||''));openAssetDetail(id)});
  document.getElementById('saveReadingBtn').onclick=async()=>{if(!metricCode.value.trim()||metricValue.value==='')return alert('أدخل رمز القياس والقيمة');const rr=await sb.rpc('record_asset_reading',{p_asset_id:id,p_metric_code:metricCode.value.trim(),p_reading_value:Number(metricValue.value),p_unit:metricUnit.value||null,p_notes:metricNote.value||null});if(rr.error)return alert('تعذر حفظ القراءة: '+rr.error.message);openAssetDetail(id)};
}



async function openWorkOrderDetail(id){
  dtitle.textContent='تفاصيل أمر العمل';
  detailBody.innerHTML='<div class="mut">جاري تحميل التفاصيل...</div>';
  detailModal.classList.add('show');
  const r=await sb.rpc('get_work_order_detail',{p_work_order_id:id});
  if(r.error||!r.data){detailBody.innerHTML=`<div class="msg" style="color:var(--danger)">تعذر تحميل أمر العمل${r.error?': '+esc(r.error.message):''}</div>`;return}
  const x=r.data,w=x.work_order,f=x.facility||{},d=x.department||{},t=x.ticket||{},tl=x.timeline||[];
  dtitle.textContent=w.work_order_number;
  const actions=[];
  if(['new','assigned'].includes(w.status)) actions.push(['start','بدء العمل','primary']);
  if(w.status==='in_progress'){actions.push(['pause','إيقاف مؤقت','secondary']);actions.push(['complete','إكمال العمل','primary'])}
  if(['paused','waiting_part','waiting_vendor','waiting_approval'].includes(w.status)) actions.push(['resume','استئناف العمل','primary']);
  if(['completed','rework'].includes(w.status)) actions.push(['close','إغلاق أمر العمل','primary']);
  let workers=[];try{const wr=await sb.rpc('get_department_workers',{p_department_id:w.department_id});workers=wr.data||[]}catch(e){}

    <div class="detailbox"><span>العنوان</span><b>${esc(w.title)}</b></div>
    <div class="detailbox"><span>الحالة</span><b>${arWO(w.status)}</b></div>
    <div class="detailbox"><span>المنشأة</span><b>${esc(f.code||'-')} - ${esc(f.city||'')}</b></div>
    <div class="detailbox"><span>القسم</span><b>${esc(d.name_ar||'-')}</b></div>
    <div class="detailbox"><span>نوع العمل</span><b>${esc(w.work_type||'-')}</b></div>
    <div class="detailbox"><span>الأولوية</span><b>${fmtPriority(w.priority)}</b></div>
    <div class="detailbox"><span>المسؤول</span><b>${esc(x.owner?.full_name||'غير مسند')}</b></div>
    <div class="detailbox"><span>البلاغ المرتبط</span><b>${esc(t.ticket_number||'-')}</b></div>

        <select class="inp" id="ownerSelect" style="flex:1;min-width:180px">
          <option value="">اختر الموظف</option>
          ${workers.map(u=>`<option value="${u.profile_id}" ${w.owner_profile_id===u.profile_id?'selected':''}>${esc(u.full_name)}${u.role_code?` - ${esc(u.role_code)}`:''}</option>`).join('')}
        </select>
        <button class="secondary" id="assignOwnerBtn">إسناد</button>
      </div>
    </div>
    <div class="detailbox"><span>وقت البدء</span><b>${w.actual_start_at?new Date(w.actual_start_at).toLocaleString('ar-SA'):'لم يبدأ'}</b></div>
    <div class="detailbox"><span>الاستحقاق</span><b>${w.due_at?new Date(w.due_at).toLocaleString('ar-SA'):'غير محدد'}</b></div>
    <div class="detailbox detailfull"><span>الوصف</span><b>${esc(w.description||'-')}</b></div>
    <div class="detailbox"><span>تكلفة القطع</span><b>${Number(w.parts_cost||0).toFixed(2)} ر.س</b></div>
    <div class="detailbox"><span>التكلفة الخارجية</span><b>${Number(w.external_cost||0).toFixed(2)} ر.س</b></div>

  ${actions.length?`<div class="row">${actions.map(a=>`<button class="${a[2]}" data-woaction="${a[0]}">${a[1]}</button>`).join('')}</div><div class="msg" id="woMsg"></div>`:''}

  <div class="panel" style="margin-top:14px;padding:14px">
    <b>جاهزية الإكمال</b>
    <div class="detailgrid" style="margin-top:10px">

      <div class="detailbox"><span>تصريح العمل</span><b>${x.readiness?.requires_permit?(x.readiness?.permit_valid?'ساري ✓':'غير ساري ✕'):'غير مطلوب'}</b></div>
      <div class="detailbox detailfull"><span>الحالة العامة</span><b>${x.readiness?.ready?'جاهز للإكمال ✓':'غير جاهز للإكمال'}</b></div>

  </div>

  ${w.status==='completed'?`<div class="panel" style="margin-top:14px;padding:14px">

  ${(x.rework_history||[]).length?`<div class="panel" style="margin-top:14px;padding:14px"><b>سجل إعادة العمل</b>${x.rework_history.map(r=>`<div class="tevent"><b>${esc(r.reason)}</b><span>${new Date(r.created_at).toLocaleString('ar-SA')}</span></div>`).join('')}</div>`:''}

          <option value="misuse" ${w.root_cause==='misuse'?'selected':''}>سوء استخدام</option>

      <div class="detailbox"><span>تكلفة خارجية</span><input class="inp" id="externalCost" type="number" min="0" step="0.01" value="${w.external_cost||0}"></div>
    </div>
    <div class="row"><button class="secondary" id="saveExecutionBtn">حفظ بيانات التنفيذ</button></div>
  </div>

  <div class="panel" style="margin-top:14px;padding:14px">
    <b>الصور والمرفقات</b>
    <div style="margin-top:8px">${(x.attachments||[]).length?(x.attachments||[]).map(a=>`<button class="secondary" style="margin:4px" data-att="${a.id}">${esc(a.file_name)} • ${a.attachment_type==='before'?'قبل':a.attachment_type==='after'?'بعد':'مرفق'}</button>`).join(''):'<div class="mut">لا توجد مرفقات</div>'}</div>
    <div class="detailgrid" style="margin-top:10px">
      <div class="detailbox"><span>نوع المرفق</span><select class="inp" id="attType"><option value="before">صورة قبل</option><option value="after">صورة بعد</option><option value="general">عام</option><option value="report">تقرير</option><option value="invoice">فاتورة</option></select></div>
      <div class="detailbox"><span>اختر ملفًا — حد أقصى 5MB</span><input class="inp" id="attFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div>
    </div>
    <div class="row"><button class="secondary" id="uploadAttBtn">رفع المرفق</button></div>
  </div>

  <div class="timeline"><b>سجل أمر العمل</b>${tl.length?tl.map(e=>`<div class="tevent"><b>${esc(e.title)}</b><span>${new Date(e.created_at).toLocaleString('ar-SA')}</span>${e.details?`<div class="mut">${esc(e.details)}</div>`:''}</div>`).join(''):'<div class="mut" style="margin-top:8px">لا توجد أحداث إضافية حتى الآن</div>'}</div>`;
  document.querySelectorAll('[data-woaction]').forEach(b=>b.onclick=()=>runWOAction(id,b.dataset.woaction));
  const approveCloseBtn=document.getElementById('approveCloseBtn');
  if(approveCloseBtn) approveCloseBtn.onclick=()=>submitClosureReview(id,'approved');
  const needInfoBtn=document.getElementById('needInfoBtn');
  if(needInfoBtn) needInfoBtn.onclick=()=>submitClosureReview(id,'needs_information');
  const reworkBtn=document.getElementById('reworkBtn');
  if(reworkBtn) reworkBtn.onclick=()=>submitClosureReview(id,'rejected_rework');
  const saveExec=document.getElementById('saveExecutionBtn');
  if(saveExec) saveExec.onclick=async()=>{
    const rc=document.getElementById('rootCause').value||null;
    const ro=document.getElementById('rootOther').value||null;
    const lm=Number(document.getElementById('laborMinutes').value||0);
    const ec=Number(document.getElementById('externalCost').value||0);
    const m=document.getElementById('woMsg'); if(m){m.style.color='var(--mut)';m.textContent='جاري الحفظ...'}
    const r=await sb.rpc('save_work_order_execution',{p_work_order_id:id,p_root_cause:rc,p_root_cause_other:ro,p_labor_minutes:lm,p_parts_cost:null,p_external_cost:ec});
    if(r.error){if(m){m.style.color='var(--danger)';m.textContent='تعذر الحفظ: '+r.error.message};return}
    openWorkOrderDetail(id);
  };
  const addMat=document.getElementById('addMatBtn');
  if(addMat) addMat.onclick=async()=>{
    const name=document.getElementById('matName').value.trim(),qty=Number(document.getElementById('matQty').value||0);
    if(!name||qty<=0)return alert('أدخل اسم المادة والكمية');
    const r=await sb.rpc('add_work_order_material',{p_work_order_id:id,p_item_name:name,p_quantity:qty,p_unit:document.getElementById('matUnit').value||null,p_availability_status:document.getElementById('matStatus').value,p_estimated_cost:null,p_actual_cost:Number(document.getElementById('matCost').value||0),p_note:document.getElementById('matNote').value||null});
    if(r.error){alert('تعذر إضافة المادة: '+r.error.message);return}
    openWorkOrderDetail(id);
  };
  const up=document.getElementById('uploadAttBtn');
  if(up) up.onclick=async()=>{
    const f=document.getElementById('attFile').files?.[0]; if(!f)return alert('اختر ملفًا');
    if(f.size>5*1024*1024)return alert('الملف أكبر من 5MB');
    up.disabled=true;up.textContent='جاري الرفع...';
    const b64=await fileToBase64(f);
    const r=await sb.rpc('add_work_order_attachment_inline',{p_work_order_id:id,p_attachment_type:document.getElementById('attType').value,p_file_name:f.name,p_mime_type:f.type||'application/octet-stream',p_base64:b64});
    if(r.error){alert('تعذر رفع المرفق: '+r.error.message);up.disabled=false;up.textContent='رفع المرفق';return}
    openWorkOrderDetail(id);
  };
  document.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>openAttachment(b.dataset.att));
  const assignBtn=document.getElementById('assignOwnerBtn');
  if(assignBtn) assignBtn.onclick=async()=>{
    const owner=document.getElementById('ownerSelect')?.value;
    if(!owner)return;
    const m=document.getElementById('woMsg');
    if(m){m.style.color='var(--mut)';m.textContent='جاري الإسناد...'}
    const r=await sb.rpc('assign_work_order',{p_work_order_id:id,p_owner_profile_id:owner});
    if(r.error){if(m){m.style.color='var(--danger)';m.textContent='تعذر الإسناد: '+r.error.message};return}
    const wr=await sb.from('work_orders').select('*').order('created_at',{ascending:false}).limit(100);
    workorders=wr.data||workorders;
    openWorkOrderDetail(id);
  };
}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
async function openAttachment(attId){
  const r=await sb.rpc('get_work_order_attachment_data',{p_attachment_id:attId});
  if(r.error){alert('تعذر فتح المرفق: '+r.error.message);return}
  const d=r.data,bin=atob(d.base64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([arr],{type:d.mime_type||'application/octet-stream'}));
  window.open(url,'_blank');
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function submitClosureReview(id,decision){
  const note=document.getElementById('closureNote')?.value?.trim()||null;
  if(decision==='rejected_rework'&&!note)return alert('سبب إعادة العمل مطلوب');
  const r=await sb.rpc('submit_work_order_closure_review',{p_work_order_id:id,p_decision:decision,p_note:note});
  if(r.error){alert('تعذر تنفيذ مراجعة الإغلاق: '+r.error.message);return}
  const [wr,tr]=await Promise.all([sb.from('work_orders').select('*').order('created_at',{ascending:false}).limit(100),sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100)]);
  workorders=wr.data||workorders;tickets=tr.data||tickets;
  openWorkOrderDetail(id);
}
async function runWOAction(id,action){
  let reason=null;
  if(action==='pause'){reason=prompt('اكتب سبب الإيقاف المؤقت');if(!reason)return}
  if(action==='resume') reason=prompt('ملاحظة الاستئناف - اختياري')||null;
  const m=document.getElementById('woMsg');if(m){m.style.color='var(--mut)';m.textContent='جاري تنفيذ الإجراء...'}
  const r=await sb.rpc('work_order_action',{p_work_order_id:id,p_action:action,p_reason:reason});
  if(r.error){if(m){m.style.color='var(--danger)';let msg=r.error.message||'';if(msg.includes('completion_requirements_not_met'))msg='لا يمكن إكمال أمر العمل قبل استيفاء المتطلبات المطلوبة (صور/قائمة تحقق/تصريح).';if(msg.includes('closure_review_required'))msg='لا يمكن الإغلاق مباشرة؛ يجب اعتماد منسق الموقع.';m.textContent='تعذر تنفيذ الإجراء: '+msg}return}
  const [wr,tr]=await Promise.all([sb.from('work_orders').select('*').order('created_at',{ascending:false}).limit(100),sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100)]);
  workorders=wr.data||workorders;tickets=tr.data||tickets;
  openWorkOrderDetail(id);
}
function canConvert(){return ['system_admin','fms_department_director','facilities_manager','facilities_supervisor','department_manager','department_supervisor'].includes(ctx?.role_code)}
function fmtPriority(p){return ({low:'منخفض',medium:'متوسط',high:'عالي',critical:'حرج',extreme:'حرج جدًا'})[p]||p||'-'}
async function openTicketDetail(id){
  dtitle.textContent='تفاصيل البلاغ';
  detailBody.innerHTML='<div class="mut">جاري تحميل التفاصيل...</div>';
  detailModal.classList.add('show');
  const r=await sb.rpc('get_ticket_detail',{p_ticket_id:id});
  if(r.error||!r.data){detailBody.innerHTML=`<div class="msg" style="color:var(--danger)">تعذر تحميل التفاصيل${r.error?': '+r.error.message:''}</div>`;return}
  const x=r.data,t=x.ticket,f=x.facility||{},d=x.department||{},wo=x.work_orders||[],tl=x.timeline||[];
  dtitle.textContent=t.ticket_number;
  const convertible=canConvert()&&!['closed','rejected','cancelled'].includes(t.status);
  detailBody.innerHTML=`<div class="detailgrid">
    <div class="detailbox"><span>عنوان البلاغ</span><b>${esc(t.subject)}</b></div>
    <div class="detailbox"><span>الحالة</span><b>${arTicket(t.status)}</b></div>
    <div class="detailbox"><span>المنشأة</span><b>${esc(f.code||'-')} - ${esc(f.city||'')}</b></div>
    <div class="detailbox"><span>القسم</span><b>${esc(d.name_ar||'-')}</b></div>
    <div class="detailbox"><span>الموقع / الغرفة</span><b>${esc(t.room_area||'-')}</b></div>
    <div class="detailbox"><span>الأولوية</span><b>${fmtPriority(t.priority)}</b></div>
    <div class="detailbox detailfull"><span>التفاصيل</span><b>${esc(t.description||'-')}</b></div>
    <div class="detailbox"><span>مقدم البلاغ</span><b>${esc(x.reporter?.full_name||x.reporter?.work_email||'-')}</b></div>
    <div class="detailbox"><span>المسؤول الحالي</span><b>${esc(x.owner?.full_name||'غير مسند')}</b></div>
  </div>
  <div style="margin-top:12px"><b style="font-size:13px">أوامر العمل المرتبطة</b><div>${wo.length?wo.map(w=>`<span class="wochip">${esc(w.work_order_number)}</span>`).join(''):'<div class="mut" style="margin-top:6px">لا يوجد أمر عمل مرتبط</div>'}</div></div>
  ${convertible?`<div class="row"><button class="primary" id="convertBtn">تحويل إلى أمر عمل</button></div><div class="msg" id="convertMsg"></div>`:''}
  <div class="timeline"><b>سجل البلاغ</b>${tl.length?tl.map(e=>`<div class="tevent"><b>${esc(e.title)}</b><span>${new Date(e.created_at).toLocaleString('ar-SA')}</span>${e.details?`<div class="mut">${esc(e.details)}</div>`:''}</div>`).join(''):'<div class="mut" style="margin-top:8px">لا توجد أحداث إضافية حتى الآن</div>'}</div>`;
  if(convertible){document.getElementById('convertBtn').onclick=()=>convertTicket(id,t)}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function convertTicket(id,t){
  const b=document.getElementById('convertBtn'),m=document.getElementById('convertMsg');b.disabled=true;m.style.color='var(--mut)';m.textContent='جاري إنشاء أمر العمل...';
  const r=await sb.rpc('convert_ticket_to_work_order',{p_ticket_id:id,p_work_type:'other',p_title:t.subject,p_description:t.description});
  if(r.error){m.style.color='var(--danger)';m.textContent='تعذر التحويل: '+r.error.message;b.disabled=false;return}
  m.style.color='var(--ok)';m.textContent='تم إنشاء '+r.data.work_order.work_order_number;
  const [tr,wr]=await Promise.all([sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100),sb.from('work_orders').select('*').order('created_at',{ascending:false}).limit(100)]);
  tickets=tr.data||tickets;workorders=wr.data||workorders;
  setTimeout(()=>openTicketDetail(id),500);
}
closeDetail.onclick=()=>detailModal.classList.remove('show');
function openTicket(){tfac.innerHTML=facilities.map(x=>`<option value="${x.id}">${x.code} - ${x.city||''}</option>`).join('');tdep.innerHTML=departments.map(x=>`<option value="${x.id}">${x.name_ar}</option>`).join('');tmsg.textContent='';ticketModal.classList.add('show')}
closeTicket.onclick=()=>ticketModal.classList.remove('show');
saveTicket.onclick=async()=>{tmsg.style.color='var(--mut)';tmsg.textContent='جاري إرسال البلاغ...';if(!ctx?.profile_id){tmsg.style.color='var(--danger)';tmsg.textContent='تعذر تحديد ملف المستخدم';return}const payload={reporter_profile_id:ctx.profile_id,facility_id:tfac.value,department_id:tdep.value,room_area:troom.value.trim()||'غير محدد',subject:tsub.value.trim(),description:tdesc.value.trim(),priority:tpri.value,priority_source:'system',original_language:'ar'};if(!payload.subject||!payload.description){tmsg.style.color='var(--danger)';tmsg.textContent='اكتب عنوان البلاغ والتفاصيل';return}const r=await sb.from('tickets').insert(payload).select().single();if(r.error){tmsg.style.color='var(--danger)';tmsg.textContent='تعذر إنشاء البلاغ: '+r.error.message;return}tmsg.style.color='var(--ok)';tmsg.textContent='تم إنشاء البلاغ '+r.data.ticket_number;setTimeout(async()=>{ticketModal.classList.remove('show');const tr=await sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100);tickets=tr.data||tickets;render('tickets')},900)}
boot();
</script></body></html>
