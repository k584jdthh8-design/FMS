<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meena FMS</title>
<style>
:root{--v:#512DA8;--p:#9C27B0;--bg:#F6F5FA;--card:#fff;--tx:#22232A;--mut:#777484;--ln:#E7E5EE;--ok:#14825C;--danger:#C7434B}
body.dark{--bg:#111117;--card:#1B1A22;--tx:#F6F3FA;--mut:#AAA6B3;--ln:#302E39}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{height:64px;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.brand{font-weight:900}.actions{display:flex;gap:8px}.ib{width:40px;height:40px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx)}
.wrap{max-width:1200px;margin:auto;padding:18px 16px 90px}.hero{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:16px}h1{margin:0;font-size:25px}.mut{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:14px}.tab{border:1px solid var(--ln);background:var(--card);padding:10px 14px;border-radius:12px;color:var(--tx);white-space:nowrap}.tab.active{background:linear-gradient(90deg,var(--v),var(--p));color:#fff;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.k{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:15px}.k b{font-size:27px;display:block}.k span{font-size:11px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}.ph{padding:15px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}.ph b{font-size:15px}
.city{padding:11px 15px;display:grid;grid-template-columns:90px 1fr 28px;gap:10px;align-items:center}.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--v),var(--p))}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.q{border:1px solid var(--ln);background:var(--card);border-radius:13px;padding:14px;text-align:right;color:var(--tx)}.q b{display:block;font-size:12px}.q span{font-size:10px;color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.inp{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:11px;padding:10px 11px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fcard{background:var(--card);border:1px solid var(--ln);border-radius:15px;padding:14px}.fcard .code{font-weight:900;font-size:16px}.fcard small{display:block;color:var(--mut);margin-top:3px}.badge{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:999px;background:#EAF6F1;color:var(--ok);font-size:10px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px 13px;border-bottom:1px solid var(--ln);font-size:12px;text-align:right;white-space:nowrap}th{color:var(--mut)}
.primary{border:0;background:linear-gradient(90deg,var(--v),var(--p));color:white;border-radius:11px;padding:10px 14px;font-weight:800}.secondary{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:11px;padding:10px 14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(650px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px}.sheet h2{margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--mut)}.field.full{grid-column:1/-1}textarea.inp{min-height:100px;resize:vertical}.row{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}.msg{font-size:12px;margin-top:10px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:24px}.loginbox h2{margin-top:0}
.bottom{display:none}
@media(max-width:850px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}}
@media(max-width:600px){.cards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.bottom{display:flex;position:fixed;bottom:12px;left:12px;right:12px;background:var(--card);border:1px solid var(--ln);border-radius:17px;padding:7px;justify-content:space-around;z-index:30}.bottom button{border:0;background:transparent;color:var(--mut);padding:8px}}
</style>
</head>
<body><div id="app"></div>
<div class="modal" id="ticketModal"><div class="sheet"><h2>بلاغ جديد</h2><div class="formgrid">
<div class="field"><label>المنشأة</label><select class="inp" id="tfac"></select></div>
<div class="field"><label>القسم</label><select class="inp" id="tdep"></select></div>
<div class="field"><label>الموقع / الغرفة</label><input class="inp" id="troom" placeholder="مثال: الدور الثاني - العلاج الطبيعي"></div>
<div class="field"><label>الأولوية</label><select class="inp" id="tpri"><option value="medium">متوسط</option><option value="low">منخفض</option><option value="high">عالي</option><option value="critical">حرج</option><option value="extreme">حرج جدًا</option></select></div>
<div class="field full"><label>عنوان البلاغ</label><input class="inp" id="tsub" placeholder="وصف مختصر للمشكلة"></div>
<div class="field full"><label>التفاصيل</label><textarea class="inp" id="tdesc" placeholder="اكتب تفاصيل المشكلة"></textarea></div>
</div><div class="row"><button class="primary" id="saveTicket">إرسال البلاغ</button><button class="secondary" id="closeTicket">إلغاء</button></div><div class="msg" id="tmsg"></div></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient("https://xlijscxrapuddtmbnxhe.supabase.co","sb_publishable_jbElXTf55gOag4vIB0ahUw_NBL1UNmF");const app=document.getElementById('app');
let facilities=[],departments=[],ctx=null,tickets=[],workorders=[];
const arType=x=>({Clinic:'عيادة',Office:'مكتب',Accommodation:'سكن'})[x]||x||'-';
const arStatus=x=>({active:'نشط',preparing:'تحت التجهيز',temporarily_closed:'مغلق مؤقتًا',inactive:'غير نشط'})[x]||x||'نشط';
const arTicket=x=>({new:'جديد',under_review:'تحت المراجعة',converted:'تم التحويل',in_progress:'قيد التنفيذ',waiting_reporter_info:'بانتظار معلومات',waiting_approval:'بانتظار اعتماد',completed:'مكتمل',closed:'مغلق',rejected:'مرفوض'})[x]||x||'-';
async function boot(){const s=await sb.auth.getSession();s.data.session?load():login()}
function login(msg=''){app.innerHTML=`<div class="login"><form class="loginbox" id="lf"><h2>Meena FMS</h2><p class="mut">تسجيل الدخول بحساب العمل</p><div class="field"><label>البريد الإلكتروني</label><input class="inp" id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input class="inp" id="pass" type="password" required></div><button class="primary" style="width:100%;margin-top:10px">دخول</button>${msg?`<div class="msg" style="color:var(--danger)">${msg}</div>`:''}</form></div>`;lf.onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});r.error?login('تعذر تسجيل الدخول'):load()}}
async function load(){app.innerHTML='<div class="login"><div class="loginbox">جاري تحميل النظام...</div></div>';const [c,f,d,t,w]=await Promise.all([sb.from('my_account_context').select('*').maybeSingle(),sb.from('facilities').select('*').order('code'),sb.from('departments').select('*').eq('is_active',true).order('name_ar'),sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100),sb.from('work_orders').select('*').order('created_at',{ascending:false}).limit(100)]);ctx=c.data;facilities=f.data||[];departments=d.data||[];tickets=t.data||[];workorders=w.data||[];render('dashboard')}
function shell(content,active){return `<div class="top"><div class="brand">MEENA FMS</div><div class="actions"><button class="ib" id="theme">◐</button><button class="ib" id="logout">↪</button></div></div><div class="wrap"><div class="tabs">${tab('لوحة التحكم','dashboard',active)}${tab('المنشآت','facilities',active)}${tab('البلاغات','tickets',active)}${tab('أوامر العمل','workorders',active)}</div>${content}</div><div class="bottom"><button data-go="dashboard">الرئيسية</button><button data-go="facilities">المنشآت</button><button data-go="tickets">البلاغات</button></div>`}
function tab(l,v,a){return `<button class="tab ${a===v?'active':''}" data-go="${v}">${l}</button>`}
function bindNav(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));theme.onclick=()=>document.body.classList.toggle('dark');logout.onclick=async()=>{await sb.auth.signOut();login()}}
function render(page){if(page==='dashboard')dashboard();if(page==='facilities')facPage();if(page==='tickets')ticketPage();if(page==='workorders')woPage();bindNav()}
function dashboard(){const cm={};facilities.forEach(x=>cm[x.city]=(cm[x.city]||0)+1);const max=Math.max(...Object.values(cm),1);const html=`<div class="hero"><div><h1>لوحة التحكم</h1><div class="mut">${ctx?.role_name_ar||'مدير النظام'} • ${ctx?.full_name||ctx?.work_email||''}</div></div><button class="primary" id="newTicket">+ بلاغ جديد</button></div><div class="kpis">${k('المنشآت',facilities.length)}${k('البلاغات',tickets.length)}${k('أوامر العمل',workorders.length)}${k('العيادات',facilities.filter(x=>x.facility_type==='Clinic').length)}${k('المدن',new Set(facilities.map(x=>x.city)).size)}</div><div class="grid"><div class="panel"><div class="ph"><b>التوزيع حسب المدينة</b></div>${Object.entries(cm).sort((a,b)=>b[1]-a[1]).map(([city,n])=>`<div class="city"><b>${city}</b><div class="bar"><div class="fill" style="width:${n/max*100}%"></div></div><span>${n}</span></div>`).join('')}</div><div class="panel"><div class="ph"><b>الوصول السريع</b></div><div class="quick"><button class="q" id="qTicket"><b>بلاغ جديد</b><span>إنشاء ومتابعة بلاغ</span></button><button class="q" data-go="workorders"><b>أوامر العمل</b><span>متابعة التنفيذ</span></button><button class="q" data-go="facilities"><b>المنشآت</b><span>استعراض الفروع</span></button><button class="q" data-go="tickets"><b>البلاغات</b><span>الحالات الحالية</span></button></div></div></div>`;app.innerHTML=shell(html,'dashboard');document.getElementById('newTicket').onclick=openTicket;document.getElementById('qTicket').onclick=openTicket}
function k(l,v){return `<div class="k"><b>${v}</b><span>${l}</span></div>`}
function facPage(){const html=`<div class="hero"><div><h1>المنشآت</h1><div class="mut">${facilities.length} منشأة مسجلة</div></div></div><div class="filters"><input class="inp" id="fsearch" placeholder="بحث عن فرع أو مدينة أو حي"><select class="inp" id="fcity"><option value="">جميع المدن</option>${[...new Set(facilities.map(x=>x.city))].sort().map(x=>`<option>${x}</option>`).join('')}</select></div><div class="cards" id="fcards">${facilities.map(fcard).join('')}</div>`;app.innerHTML=shell(html,'facilities');const filt=()=>{const q=fsearch.value.toLowerCase(),c=fcity.value;fcards.innerHTML=facilities.filter(x=>(!q||[x.code,x.name_ar,x.name_en,x.city,x.district].join(' ').toLowerCase().includes(q))&&(!c||x.city===c)).map(fcard).join('')};fsearch.oninput=filt;fcity.onchange=filt}
function fcard(x){return `<div class="fcard"><div class="code">${x.code}</div><small>${x.name_ar||x.name_en||x.code}</small><small>${x.district||'-'} • ${x.city||'-'}</small><small>${arType(x.facility_type)}</small><span class="badge">${arStatus(x.status)}</span></div>`}
function ticketPage(){const rows=tickets.map(x=>`<tr><td><b>${x.ticket_number}</b></td><td>${x.subject}</td><td>${arTicket(x.status)}</td><td>${x.priority}</td><td>${new Date(x.created_at).toLocaleDateString('ar-SA')}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">لا توجد بلاغات حتى الآن</td></tr>';const html=`<div class="hero"><div><h1>البلاغات</h1><div class="mut">متابعة البلاغات حسب صلاحيات حسابك</div></div><button class="primary" id="newTicket">+ بلاغ جديد</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>الرقم</th><th>العنوان</th><th>الحالة</th><th>الأولوية</th><th>التاريخ</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;app.innerHTML=shell(html,'tickets');document.getElementById('newTicket').onclick=openTicket}
function woPage(){const rows=workorders.map(x=>`<tr><td><b>${x.work_order_number}</b></td><td>${x.title}</td><td>${x.status}</td><td>${x.priority}</td><td>${new Date(x.created_at).toLocaleDateString('ar-SA')}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">لا توجد أوامر عمل حتى الآن</td></tr>';const html=`<div class="hero"><div><h1>أوامر العمل</h1><div class="mut">المتابعة التشغيلية لأوامر العمل</div></div></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>الرقم</th><th>العنوان</th><th>الحالة</th><th>الأولوية</th><th>التاريخ</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;app.innerHTML=shell(html,'workorders')}
function openTicket(){tfac.innerHTML=facilities.map(x=>`<option value="${x.id}">${x.code} - ${x.city||''}</option>`).join('');tdep.innerHTML=departments.map(x=>`<option value="${x.id}">${x.name_ar}</option>`).join('');tmsg.textContent='';ticketModal.classList.add('show')}
closeTicket.onclick=()=>ticketModal.classList.remove('show');
saveTicket.onclick=async()=>{tmsg.style.color='var(--mut)';tmsg.textContent='جاري إرسال البلاغ...';if(!ctx?.profile_id){tmsg.style.color='var(--danger)';tmsg.textContent='تعذر تحديد ملف المستخدم';return}const payload={reporter_profile_id:ctx.profile_id,facility_id:tfac.value,department_id:tdep.value,room_area:troom.value.trim()||'غير محدد',subject:tsub.value.trim(),description:tdesc.value.trim(),priority:tpri.value,priority_source:'user',original_language:'ar'};if(!payload.subject||!payload.description){tmsg.style.color='var(--danger)';tmsg.textContent='اكتب عنوان البلاغ والتفاصيل';return}const r=await sb.from('tickets').insert(payload).select().single();if(r.error){tmsg.style.color='var(--danger)';tmsg.textContent='تعذر إنشاء البلاغ: '+r.error.message;return}tmsg.style.color='var(--ok)';tmsg.textContent='تم إنشاء البلاغ '+r.data.ticket_number;setTimeout(async()=>{ticketModal.classList.remove('show');const tr=await sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100);tickets=tr.data||tickets;render('tickets')},900)}
boot();
</script></body></html>
