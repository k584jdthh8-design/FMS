<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meena FMS</title><style>
:root{--v:#512DA8;--p:#9C27B0;--bg:#f6f5fa;--card:#fff;--tx:#24232b;--mut:#777484;--ln:#e8e6ef;--ok:#11815e;--shadow:0 12px 30px rgba(56,43,99,.08)}body.dark{--bg:#111117;--card:#1b1a22;--tx:#f7f4fa;--mut:#aaa5b3;--ln:#302e39;--shadow:0 12px 30px rgba(0,0,0,.24)}*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:258px;position:fixed;right:0;top:0;bottom:0;background:linear-gradient(180deg,#4c279b,#692aa9 55%,#401f7c);color:#fff;padding:18px 12px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 20px}.logo{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900}.brand strong{display:block;font-size:18px}.brand small{font-size:10px;opacity:.78}.nav button{border:0;background:transparent;color:#eee9f7;border-radius:12px;padding:10px 11px;display:flex;align-items:center;gap:10px;text-align:right;width:100%;margin:2px 0}.nav button.active,.nav button:hover{background:rgba(255,255,255,.13);color:#fff}.ico{width:18px;height:18px}.main{margin-right:258px;width:calc(100% - 258px)}.top{height:70px;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.actions{display:flex;gap:8px;align-items:center}.ib{width:40px;height:40px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx)}.user{border:1px solid var(--ln);background:var(--card);border-radius:13px;padding:8px 11px;font-size:11px}.content{padding:22px}.hero{display:flex;justify-content:space-between;align-items:end;gap:14px}.hero h1{font-size:27px;margin:0 0 5px}.hero p{margin:0;color:var(--mut);font-size:13px}.filters{display:flex;gap:8px}.filters input,.filters select{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:11px;padding:10px 11px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:18px}.kpi{background:var(--card);border:1px solid var(--ln);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.kpi b{font-size:29px;display:block}.kpi span{font-size:12px;color:var(--mut)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.panel{background:var(--card);border:1px solid var(--ln);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.ph{padding:15px 17px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}.ph h3{margin:0;font-size:15px}.ph span{font-size:11px;color:var(--mut)}.citylist{padding:8px 17px 16px}.cityrow{display:grid;grid-template-columns:88px 1fr 28px;gap:10px;align-items:center;padding:9px 0}.bar{height:8px;background:var(--ln);border-radius:100px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--v),var(--p))}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:15px}.quick button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:14px;text-align:right}.quick strong{display:block;font-size:12px}.quick span{font-size:10px;color:var(--mut)}.tablepanel{margin-top:14px}.tablewrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:11px 14px;border-bottom:1px solid var(--ln);font-size:12px;text-align:right;white-space:nowrap}th{color:var(--mut);background:var(--card);position:sticky;top:0}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#e9f7f1;color:var(--ok);font-size:10px}.empty{color:var(--mut)}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.visual{background:linear-gradient(145deg,#432080,#6d2baa 55%,#9c27b0);color:#fff;padding:54px;display:flex;flex-direction:column;justify-content:space-between}.visual h1{font-size:42px}.formwrap{display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.field{display:grid;gap:7px;margin:14px 0}.field input{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:12px}.primary{width:100%;border:0;border-radius:12px;padding:13px;color:#fff;background:linear-gradient(90deg,var(--v),var(--p));font-weight:800}.err{margin-top:12px;color:#b82d39;font-size:12px}@media(max-width:800px){.side{display:none}.main{margin:0;width:100%}.top{height:64px;padding:0 14px}.content{padding:15px}.hero{flex-direction:column;align-items:stretch}.hero h1{font-size:22px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.visual{display:none}.user{display:none}}
</style></head><body><div id="app"></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://xlijscxrapuddtmbnxhe.supabase.co','sb_publishable_jbElXTf55gOag4vIB0ahUw_NBL1UNmF');const app=document.getElementById('app');
const icon=n=>({dash:'▦',building:'▥',ticket:'▤',wrench:'⌁',shield:'◇',home:'⌂',report:'▧',settings:'⚙'}[n]||'•');
function login(msg=''){app.innerHTML=`<div class="login"><section class="visual"><div><b>MEENA FMS</b></div><div><h1>إدارة المرافق بشكل أوضح وأسرع</h1><p>المنشآت، البلاغات، أوامر العمل، الصيانة، السلامة، الأصول، العقود والجولات في منصة واحدة.</p></div><small>Meena Health</small></section><section class="formwrap"><form class="card" id="f"><h2>تسجيل الدخول</h2><p style="color:var(--mut);font-size:13px">استخدم حساب العمل المعتمد.</p><div class="field"><label>البريد الإلكتروني</label><input id="e" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="p" type="password" required></div><button class="primary">دخول إلى النظام</button>${msg?`<div class="err">${msg}</div>`:''}</form></section></div>`;document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const {error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});error?login('تعذر تسجيل الدخول. تحقق من البيانات.'):dash()}}
async function dash(){app.innerHTML='<div style="padding:40px">جاري التحميل...</div>';const [{data:{user}},{data:f,error}]=await Promise.all([sb.auth.getUser(),sb.from('facilities').select('code,name_ar,name_en,facility_type,city,district,status,health_score').order('code')]);if(!user)return login();if(error){app.innerHTML='<div style="padding:40px">تعذر تحميل البيانات بسبب الصلاحيات.</div>';return}const c={total:f.length,clinic:f.filter(x=>x.facility_type==='Clinic').length,office:f.filter(x=>x.facility_type==='Office').length,acc:f.filter(x=>x.facility_type==='Accommodation').length,cities:new Set(f.map(x=>x.city).filter(Boolean)).size};const cm={};f.forEach(x=>cm[x.city]=(cm[x.city]||0)+1);const max=Math.max(...Object.values(cm),1);let name=user.email.split('@')[0],role='System Admin';try{const x=await sb.from('my_account_context').select('*').maybeSingle();if(!x.error&&x.data){name=x.data.full_name||name;role=x.data.role_name_ar||x.data.role_code||role}}catch{}const rows=f.map(x=>`<tr data-s="${[x.code,x.name_ar,x.name_en,x.city,x.district].join(' ').toLowerCase()}"><td><b>${x.code}</b></td><td>${x.name_ar||x.name_en||x.code}</td><td>${x.district||'-'}</td><td>${x.city||'-'}</td><td>${({Clinic:'عيادة',Office:'مكتب',Accommodation:'سكن'})[x.facility_type]||x.facility_type}</td><td><span class="status">${x.status==='active'?'نشط':'تحت التجهيز'}</span></td><td>${x.health_score==null?'<span class="empty">بانتظار البيانات</span>':Math.round(x.health_score)+'%'}</td></tr>`).join('');app.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">M</div><div><strong>MEENA FMS</strong><small>Facilities Management System</small></div></div><nav class="nav">${[['لوحة التحكم','dash'],['المنشآت','building'],['البلاغات وأوامر العمل','ticket'],['الصيانة','wrench'],['الأمن والسلامة','shield'],['السكن','home'],['الجولات وقوائم الفحص','dash'],['الأصول والمخزون','building'],['العقود والموردون','ticket'],['التقارير','report'],['إدارة النظام','settings']].map((x,i)=>`<button class="${i===0?'active':''}"><span class="ico">${icon(x[1])}</span>${x[0]}</button>`).join('')}</nav></aside><main class="main"><header class="top"><b>لوحة التحكم</b><div class="actions"><button class="ib" id="theme">◐</button><div class="user"><b>${name}</b><br><span>${role}</span></div><button class="ib" id="out">↪</button></div></header><div class="content"><section class="hero"><div><h1>نظرة عامة على المرافق</h1><p>ملخص مباشر لشبكة منشآت Meena حسب صلاحيات حسابك.</p></div><div class="filters"><input id="search" placeholder="بحث عن فرع أو مدينة أو حي"><select id="city"><option value="">جميع المدن</option>${Object.keys(cm).sort().map(x=>`<option>${x}</option>`).join('')}</select></div></section><section class="kpis">${[['إجمالي المنشآت',c.total],['العيادات',c.clinic],['المكاتب',c.office],['المساكن',c.acc],['المدن',c.cities]].map(x=>`<div class="kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</section><section class="grid"><div class="panel"><div class="ph"><h3>التوزيع حسب المدينة</h3><span>${c.total} منشأة</span></div><div class="citylist">${Object.entries(cm).sort((a,b)=>b[1]-a[1]).map(([ct,n])=>`<div class="cityrow"><b>${ct}</b><div class="bar"><div class="fill" style="width:${n/max*100}%"></div></div><span>${n}</span></div>`).join('')}</div></div><div class="panel"><div class="ph"><h3>الوصول السريع</h3><span>تشغيل يومي</span></div><div class="quick"><button><strong>بلاغ جديد</strong><span>إنشاء ومتابعة بلاغ</span></button><button><strong>أمر عمل</strong><span>متابعة التنفيذ</span></button><button><strong>جولة اليوم</strong><span>قوائم الفحص</span></button><button><strong>التنبيهات</strong><span>الحالات المتأخرة والحرجة</span></button></div></div></section><section class="panel tablepanel"><div class="ph"><h3>المنشآت</h3><span id="count">${f.length} منشأة</span></div><div class="tablewrap"><table><thead><tr><th>الكود</th><th>الفرع</th><th>الحي</th><th>المدينة</th><th>النوع</th><th>الحالة</th><th>Health Score</th></tr></thead><tbody id="rows">${rows}</tbody></table></div></section></div></main></div>`;theme.onclick=()=>document.body.classList.toggle('dark');out.onclick=async()=>{await sb.auth.signOut();login()};const filter=()=>{const q=search.value.toLowerCase().trim(),ct=city.value.toLowerCase();let n=0;document.querySelectorAll('#rows tr').forEach(tr=>{const s=tr.dataset.s||'';const ok=(!q||s.includes(q))&&(!ct||s.includes(ct));tr.style.display=ok?'':'none';if(ok)n++});count.textContent=n+' منشأة'};search.oninput=filter;city.onchange=filter}
const {data:{session}}=await sb.auth.getSession();session?dash():login();
</script></body></html>
